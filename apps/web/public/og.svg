<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F4F1EA" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="1" r="0.8">
      <stop offset="0" stop-color="#FFB23F" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFB23F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0B0B0C"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- wordmark (same geometry as the in-app Logo, scaled 4x) -->
  <g transform="translate(80 64) scale(4)" fill="none">
    <g stroke="#F4F1EA" stroke-width="4.5">
      <path d="M13 11.25H5.625A3.375 3.375 0 0 0 5.625 18H9.375A3.375 3.375 0 0 1 9.375 24.75H1.5"/>
      <path d="M21 3V18.5A6.25 6.25 0 0 0 27.25 24.75H29"/>
      <path d="M16.5 11.25H28.5"/>
      <path d="M34.75 18H48.25A6.75 6.75 0 1 0 46.27 22.77"/>
      <path d="M56.25 9V32"/>
      <circle cx="63" cy="18" r="6.75"/>
      <path d="M77.75 9V18A6.75 6.75 0 0 0 91.25 18"/>
      <path d="M91.25 9V27"/>
      <path d="M99.25 9V32"/>
      <circle cx="106" cy="18" r="6.75"/>
    </g>
    <path d="M0 41.5H52.25V38.5H95.25V35.5H118.5V20" stroke="#FFB23F" stroke-width="3"/>
  </g>

  <text x="80" y="340" fill="#F4F1EA" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="600" letter-spacing="-1.8">Every fee is a step up.</text>
  <g fill="#C9C2B5" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="27">
    <text x="80" y="400">Creator fees trade tokenized-stock perps. Every fee and every</text>
    <text x="80" y="438">profitable trade buys back and burns your token,</text>
    <text x="80" y="476">so its floor only steps up.</text>
  </g>

  <!-- the stepped line: only ever steps up -->
  <path d="M0 590H300V566H560V542H820V518H1080V494H1200" fill="none" stroke="#FFB23F" stroke-width="6"/>

  <g font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="24" fill="#9A9284">
    <text x="80" y="548">stepup.fun</text>
    <text x="1120" y="72" text-anchor="end" fill="#FFB23F">$STEP</text>
  </g>
</svg>
